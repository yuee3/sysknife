name: macOS survey

permissions:
  contents: read

# Dispatch-only evidence run for lacs-project/sysknife#411. Every job in
# ci.yml is `runs-on: ubuntu-latest`, so the workspace suite has only ever
# been observed on Linux. This job records what `cargo nextest run
# --workspace --locked` does on a GitHub-hosted macOS runner. Failures are
# the data, not a red build: the survey step is allowed to fail and the raw
# output is captured either way, so the platform claim lands from
# measurement instead of inference from `#[cfg]` lines. Remove once #411
# closes.

on:
  workflow_dispatch:

jobs:
  nextest-survey:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable (branch)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Platform record
        # #411 wants the runner image and architecture beside the numbers:
        # macos-latest is Apple Silicon today, and an Intel Mac can fail
        # differently.
        run: |
          echo "ImageOS=${ImageOS} ImageVersion=${ImageVersion}"
          echo "RUNNER_OS=${RUNNER_OS} RUNNER_ARCH=${RUNNER_ARCH}"
          sw_vers
          uname -s -m -r
          rustc -vV

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c  # v2.87.10
        with:
          tool: cargo-nextest

      - name: Nextest survey (whole workspace)
        continue-on-error: true
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked 2>&1 | tee nextest-macos.txt

      - name: Nextest survey excluding sysknife-cli
        # Stage B: the whole-workspace pass aborts in the build —
        # apps/sysknife-cli/src/runner.rs:123 matches on the
        # `SocketTarget::Vsock` variant without the `#[cfg(target_os =
        # "linux")]` the variant itself carries (client.rs:79), so
        # sysknife-cli does not compile on macOS. Excluding that package
        # lets the survey measure what the rest of the workspace actually
        # does once the tests can run. --no-fail-fast so the failure count
        # is the whole suite's, not whatever ran before the first red.
        continue-on-error: true
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --exclude sysknife-cli --no-fail-fast 2>&1 | tee nextest-macos-excl-cli.txt

      - name: Survey summary
        if: always()
        run: |
          for f in nextest-macos.txt nextest-macos-excl-cli.txt; do
            echo "=== $f: final summary ==="
            grep -E 'Summary \[' "$f" || echo '(no nextest summary — the build did not reach the test run)'
            echo "=== $f: compile errors ==="
            grep -E 'error\[|^error:' "$f" | head -40 || true
            echo "=== $f: failing / panicking tests ==="
            grep -E '×|FAIL|panicked' "$f" | head -60 || true
          done

      - name: Upload raw survey output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nextest-macos
          path: |
            nextest-macos.txt
            nextest-macos-excl-cli.txt
          if-no-files-found: warn
